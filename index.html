<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat VISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles/localStyles.css" />
  </head>
  <body class="bg-gray-900">
    <div class="container mx-auto p-4 text-center">
      <div class="flex flex-row items-end justify-center">
          <img
            src="assets/logoChat.png"
            alt="Logo Chat VISA"
            class="w-24 h-24"
          />
          <h1 class="text-3xl font-bold text-white">Chat VISA</h1>
      </div>
      <h3 class="text-xl text-gray-300 my-4">
        Assistente Inteligente da Vigilância Sanitária
      </h3>
    </div>

    <div
      id="chat-container"
      class="bg-gray-950 container mx-auto p-4 rounded-lg h-96 w-full overflow-y-auto"
    ></div>

    <form
      id="form"
      class="container my-4 mx-auto p-4 flex gap-2"
    >
      <input
        type="text"
        id="input"
        placeholder="Digite sua dúvida sobre a legislação..."
        required
        autocomplete="off"
        class="p-2 bg-gray-600 rounded text-white w-full focus:outline-none"
      />
      <button
        type="button"
        id="send-btn"
        class="bg-white hover:bg-gray-700 font-bold py-2 px-4 rounded"
      >
        Perguntar
      </button>
    </form>
  </body>
  <script src="scripts/main.js"></script>
</html>
