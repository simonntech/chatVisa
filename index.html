<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat VISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="styles/localStyles.css" />
  </head>
  <body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">
    <header id="header" class="w-full border-b border-gray-800 p-4 bg-gray-900 flex items-end justify-center">
      <div class="flex items-center gap-3">
        <img
          src="assets/logoChat.png"
          alt="Logo Chat VISA"
          class="w-24 h-24 transition-all"
        />
        <div>
          <h1 class="text-4xl font-bold leading-tight">Chat VISA</h1>
          <p id="header-subtitle" class="text-sm text-gray-400 hidden sm:block">
            Assistente Inteligente da Vigilância Sanitária
          </p>
        </div>
      </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-between overflow-hidden relative max-w-4xl w-full mx-auto px-4">
      
      <div
        id="welcome-screen"
        class="flex-1 flex flex-col items-center justify-center text-center p-4 transition-all duration-300"
      >
        
        <p class="text-gray-400 max-w-md">
          Faça perguntas sobre legislações, normas e condutas da Vigilância Sanitária.
        </p>
      </div>

      <div
        id="chat-container"
        class="hidden bg-gray-900 flex-1 w-full overflow-y-auto p-4 space-y-4"
      ></div>
      <div class="w-full py-4 bg-gray-900">
        <form id="form" class="flex gap-2 bg-gray-800 p-2 rounded-xl border border-gray-700 focus-within:border-gray-500 my-8">
          <input
            type="text"
            id="input"
            placeholder="Digite sua dúvida sobre a legislação..."
            required
            autocomplete="off"
            class="p-2 bg-transparent text-white w-full focus:outline-none placeholder-gray-400"
          />
          <button
            type="submit"
            id="send-btn"
            class="bg-white hover:bg-gray-700 text-black font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center"
          >
            Perguntar
          </button>
        </form>
      </div>
    </main>

    <script src="scripts/main.js"></script>
  </body>
</html>
